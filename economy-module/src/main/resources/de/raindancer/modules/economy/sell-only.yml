# What the shop buys from players and never sells, because a bought one is worth more than it cost — an ore
# mined with Fortune, a map leading to treasure, a key opening a vault — or because only loot or a trade makes it.
# Whole names, or one star at the start or the end. Anything priced only by its rarity (nothing else prices it:
# bedrock, command blocks, spawners) is never sold either, without being written here.
# An owner's own buy price for one (shop.buy-prices) still puts it on sale.
- "*_ore"
- infested_*
- "*_map"
- "*_pottery_sherd"
- music_disc_*
