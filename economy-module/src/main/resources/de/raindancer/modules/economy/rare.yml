# What should stay rare in the game: the shop does not sell it (shop.sell-rare off), though it still buys it.
# End-game progress, boss drops and one-of-a-kind finds — bought, they would skip what the game is about.
# Whatever is made from one of these is rare too, without being written here: a beacon has a nether star in it.
# Whole names, or one star at the start or the end. What sell-only.yml lists is never sold anyway.
# An owner's own buy price for one (shop.buy-prices) still puts it on sale.

# Netherite: debris, scrap, ingots, blocks, tools, armour — and the template that makes them
- ancient_debris
- netherite_*
- "*_smithing_template"

