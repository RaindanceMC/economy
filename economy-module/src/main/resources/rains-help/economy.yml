id: economy
title: Money & the bank
summary: Your balance, the bank screen, statements, the richest list and what keeps your money safe.
intro: |
  On <white>{server}</white> money pays for most of the things you will want. This is how it works.
icon: GOLD_INGOT
category: Economy & trade
order: 10
module: economy
aliases: [money, bank, balance, bal, coins, currency, richest, baltop, wallet]
keywords: [account, statement, balance, rich, sidebar, leaderboard, offline]
commands: [balance, bank, baltop]
related: [pay, cash, shop, earning, taxes, treasury]
sections:
  - question: What is money here?
    title: The currency
    text: |
      The currency is the <white>{setting:economy:currency.singular}</white> (several: <white>{setting:economy:currency.plural}</white>), written like {money:1500}. There are no decimals, only whole units.

      Everybody gets an account the moment they first join, with {setting:economy:accounts.starting-balance|money} in it. Every plugin on the server charges through that same account, so one balance pays for everything.
  - question: How do I see my balance?
    title: Balance
    text: |
      {run:/balance} tells you what you have and where that ranks you on the server. {cmd:/balance <player>} shows somebody else's. The short names <white>/bal</white> and <white>/money</white> work too.

      {if:economy:accounts.action-bar}Whenever money moves for you, <white>+5</white> or <white>-5</white> and your new balance show above your hotbar.{else}The server does not show every change above your hotbar. Check {cmd:/balance} instead.{/if}
  - question: What does the bank screen do?
    title: The bank screen
    text: |
      {run:/bank} opens everything money does: paying somebody, your statement, your jobs, the richest list, withdrawing and paying in cash, loans, the shop, selling, the auction house and the casino. Buttons for switched-off features are greyed out. Click one to see why.

      A button for <white>The server's money</white> leads to the treasury, community funds, repair, bet insurance and season points. See {topic:treasury}.
      {if:core:bank-in-person-only}
      <gold>On this server the bank only opens when you talk to a banker standing in the world.</gold> Look for one near the spawn and right-click.{/if}
  - question: Where is my statement?
    title: Statement
    text: |
      Everything that went in or out of your account is written down. Open {run:/bank}, then <white>Statement</white> to read it as a book. Shift-click it to print a copy you can keep in your inventory.

      Old lines are removed after {setting:economy:accounts.history-days|days}, so print what you want to keep.
  - question: Who is the richest?
    title: Richest players
    when: economy:features.baltop
    text: |
      {run:/baltop} (or <white>/richest</white>) lists the richest players, ranked by what is in the bank. Cash that somebody carries is not counted.
      {if:economy:features.leaderboards}

      Floating leaderboards of the richest also stand in the world, wherever staff put them; they show the top {setting:economy:leaderboard.size|count}.{/if}
  - question: What is that list on my screen?
    title: The sidebar
    when: economy:features.sidebar
    text: |
      Your balance, your rank and the richest {setting:economy:sidebar.richest|count} players, shown on the right of the screen. {cmd:/bank sidebar} hides it, and the same command (or the sign button in the bank screen) brings it back. A minigame's own sidebar always wins while the game runs.
  - question: Is there a limit to what I can hold?
    title: Account limit
    text: |
      Yes: {setting:economy:accounts.most|money}. Anything that would take your balance past it is refused. You get a message, nothing moves and nothing is lost.

      Staff can also <white>freeze</white> an account (for example during an investigation). A frozen account can neither send nor receive money until staff release it.
  - question: What if I was offline when I got paid?
    title: While you were away
    text: |
      Payments, bills, wages, winnings and auction or raffle proceeds that arrived while you were gone are added up in one line when you log in: <i>"Received while you were offline: X."</i> Nothing is lost between sessions.
  - question: Is my money safe?
    title: Safety
    text: |
      Money in your account cannot be stolen, dropped or lost.

      <white>Cash</white> you withdraw is different: coins and cheques are items that you can carry, trade, drop and lose. See {topic:cash}.
      {if:economy-supply:death.costs-money && economy-supply:death.lose-percent > 0}

      Dying costs you {setting:economy-supply:death.lose-percent|percent} of your balance, destroyed.{/if}
      {if:economy-supply:death.costs-money && economy-supply:death.lose-percent > 0 && economy-supply:death.lose-most}
      Never more than {setting:economy-supply:death.lose-most|money} at a time.{/if}
  - question: Why does money sometimes say no?
    title: When it refuses
    text: |
      The usual reasons: you do not have enough, the amount would push somebody past the account limit, the account is frozen, or the bank is briefly unavailable (<i>"The bank is not open right now. Nothing was taken."</i> Try again in a moment).
      {if:economy-supply:money-supply.capped}

      This server also caps the total amount of money that exists. When the treasury runs dry, payouts such as rewards or shop sales are refused until fees and taxes refill it. See {topic:treasury}.{/if}
      {if:economy-supply:pay.new-account-lock && economy-supply:pay.new-account-hours > 0}

      New accounts cannot send money away (paying, billing, withdrawing cash) for their first {setting:economy-supply:pay.new-account-hours|hours}.{/if}
  - question: How do I earn money?
    title: Earning
    text: |
      Sell things to the shop, win a daily reward, collect advancements, earn interest, get hired by another player, run an auction or gamble. Start at {topic:earning} and {topic:shop}.
  - question: What about other servers of the network?
    title: Network
    text: |
      If this server is part of a network, one server keeps everybody's money. On the others, {cmd:/balance}, {cmd:/pay} and {cmd:/baltop} reach the bank through the network, and everything else says <i>"That is on the server that keeps the network's money."</i> Go there to use it.
      {if:economy-client:shop-here}

      On this server the bank's shop is open too: {cmd:/shop} and {cmd:/sell} work here with the bank's prices. Books, potions, packs and the rest stay on the bank's server.{/if}
