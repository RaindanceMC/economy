id: hilo
title: Hi-Lo
summary: Guess whether the next card is higher or lower, and cash out any time.
intro: |
  Every right guess grows the pot. A wrong guess ends it. You can cash out at any time.
icon: LIME_CONCRETE
category: Games
order: 77
module: economy
when: economy:features.gambling && economy:features.hilo
aliases: [high-low, higher-lower]
keywords: [hilo, cards, streak, cash-out]
commands: [hilo]
related: [casino, mines, blackjack]
sections:
  - question: How do I play?
    title: Playing
    text: |
      {run:/hilo} opens the table. A card is showing; guess whether the next is higher or lower. The same rank loses either guess. A right guess multiplies your stake by a fair figure worked out from what is actually left in the shoe ({setting:economy:casino.decks|count} deck(s)).
  - question: When do I get paid?
    title: Cashing out
    text: |
      After a right guess, press <white>Cash out</white> whenever you like and take what the stake has grown to. {if:economy:hilo.max-multiplier}A run that reaches {setting:economy:hilo.max-multiplier}× is paid out by itself.{/if} A wrong guess loses it all. Once the first card is showing, your bet is on the table: you can only cash out after a right guess. Closing the window or leaving then cashes out for you; before your first guess the card waits for you, and {run:/hilo} picks it up again.
  - question: Edge and minimum?
    title: Edge and minimum
    text: |
      The house keeps {if:economy:hilo.house-edge-percent}{setting:economy:hilo.house-edge-percent|percent}{else}{setting:economy:gamble.house-edge-percent|percent}{/if} of every right guess, so the longer you run, the more it keeps. Smallest bet: {if:economy:hilo.min-bet}{setting:economy:hilo.min-bet|money}{else}{setting:economy:gamble.min-bet|money}{/if}.
