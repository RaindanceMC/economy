id: scratch-cards
title: Scratch cards
summary: Buying tickets you can carry or give away, and scratching them for three alike.
intro: |
  Buy a card, scratch it and win if three symbols match. You can also give cards away.
icon: MAP
category: Games
order: 82
module: economy
when: economy:features.gambling && economy:features.scratch
aliases: [scratch, ticket, scratchcard, card]
keywords: [scratch, ticket, prize]
commands: [scratch]
related: [casino, lottery]
sections:
  - question: How do I buy one?
    title: Buying
    text: |
      {cmd:/scratch buy <count>} (or {run:/scratch} for one). A card costs {setting:economy:scratch.price|money}. At a scratch card dealer you buy them at the table. They land in your inventory.
  - question: How do I scratch it?
    title: Scratching
    text: |
      Right-click the card. What it wins is drawn when you scratch it and paid at once. The nine fields only show the result. Three alike win that symbol's prize: clover, cherry, bell, star, crown, or the diamond jackpot. Each card is numbered and sealed like a cheque. A copy is taken away when scratched.
  - question: Can I give one away?
    title: Giving
    text: |
      Yes. A card is an item. Whoever scratches it gets the prize. The house keeps {if:economy:scratch.house-edge-percent}{setting:economy:scratch.house-edge-percent|percent}{else}{setting:economy:gamble.house-edge-percent|percent}{/if} on average.
